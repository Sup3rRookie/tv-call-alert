plugins {
    id 'java-library'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

compileJava {
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
